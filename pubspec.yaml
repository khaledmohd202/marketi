name: marketi
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  animate_do: ^4.2.0
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_localization: ^0.3.3
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.4
  flutter_zoom_drawer: ^3.2.0
  fluttertoast: ^9.0.0
  get_it: ^9.2.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  very_good_analysis: ^9.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/auth/
    
    - assets/lang/
    - assets/fonts/
    - assets/icons/
  # example:
  fonts:
    # English Font
    - family: Poppins
      fonts:
        - asset: assets/fonts/english/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/english/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/Poppins-Regular.ttf
          weight: 400
    # Arabic Font
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/arabic/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/Cairo-Regular.ttf
          weight: 400
